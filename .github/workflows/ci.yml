name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib pytest gymnasium absl-py gin-config
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run test suite
        run: MPLCONFIGDIR=/tmp/mpl python -m pytest neurosilicon/tests/ -q
