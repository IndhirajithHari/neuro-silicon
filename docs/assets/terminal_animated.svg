<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Window Drop Shadow -->
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Terminal Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Terminal Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Staggered sequential reveals */
      @keyframes showL1 { 0%, 5% { opacity: 0; transform: translateY(4px); } 8%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL2 { 0%, 12% { opacity: 0; transform: translateY(4px); } 16%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL3 { 0%, 20% { opacity: 0; transform: translateY(4px); } 24%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL4 { 0%, 28% { opacity: 0; transform: translateY(4px); } 32%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL5 { 0%, 36% { opacity: 0; transform: translateY(4px); } 40%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL6 { 0%, 46% { opacity: 0; transform: translateY(4px); } 50%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL7 { 0%, 56% { opacity: 0; transform: translateY(4px); } 60%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL8 { 0%, 66% { opacity: 0; transform: translateY(4px); } 70%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL9 { 0%, 76% { opacity: 0; transform: translateY(4px); } 80%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL10 { 0%, 86% { opacity: 0; transform: translateY(4px); } 90%, 100% { opacity: 1; transform: translateY(0); } }

      .anim-loop {
        animation-duration: 15s;
        animation-iteration-count: infinite;
        animation-fill-mode: both;
      }

      .line-1  { animation-name: showL1; }
      .line-2  { animation-name: showL2; }
      .line-3  { animation-name: showL3; }
      .line-4  { animation-name: showL4; }
      .line-5  { animation-name: showL5; }
      .line-6  { animation-name: showL6; }
      .line-7  { animation-name: showL7; }
      .line-8  { animation-name: showL8; }
      .line-9  { animation-name: showL9; }
      .line-10 { animation-name: showL10; }

      .cursor {
        animation: blinkCursor 0.9s infinite;
      }

      .term-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
    </style>
  </defs>

  <!-- Window Container with Shadow -->
  <g filter="url(#winShadow)">
    <!-- Terminal Outer Frame -->
    <rect x="20" y="20" width="880" height="420" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1.2" />

    <!-- Title Bar -->
    <rect x="20" y="20" width="880" height="38" rx="12" fill="url(#headerGrad)" />
    <!-- Square off the bottom corners of the header -->
    <rect x="20" y="46" width="880" height="12" fill="url(#headerGrad)" />
    <line x1="20" y1="58" x2="900" y2="58" stroke="#1e293b" stroke-width="1" />

    <!-- Window Control Buttons (macOS / GNOME style) -->
    <circle cx="44" cy="39" r="6" fill="#ef4444" />
    <circle cx="64" cy="39" r="6" fill="#f59e0b" />
    <circle cx="84" cy="39" r="6" fill="#10b981" />

    <!-- Title Bar Text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="460" y="43" font-weight="500">neurosilicon@workstation: ~/neuro-silicon (RL Edge-GNN + SAM Engine)</text>
    </g>

    <!-- Branch / Environment Indicator -->
    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#64748b" text-anchor="end">
      <text x="880" y="43">env: .venv (py3.12)</text>
    </g>

    <!-- Terminal Content Area -->
    <g class="term-text" transform="translate(48, 90)">
      <!-- Line 1: Command Execution -->
      <g class="line-1 anim-loop">
        <text y="0" fill="#38bdf8" font-weight="bold">➜</text>
        <text x="20" y="0" fill="#a855f7" font-weight="bold">neuro-silicon</text>
        <text x="135" y="0" fill="#f1f5f9">python -m neurosilicon.desktop --design servant_soc</text>
      </g>

      <!-- Line 2: Ingestion -->
      <g class="line-2 anim-loop">
        <text y="28" fill="#64748b">[0.02s]</text>
        <text x="64" y="28" fill="#0ea5e9" font-weight="bold">[INGEST]</text>
        <text x="145" y="28" fill="#cbd5e1">Ingesting Servant RISC-V SoC netlist (SkyWater 130nm PDK)...</text>
      </g>

      <!-- Line 3: Graph Construction -->
      <g class="line-3 anim-loop">
        <text y="56" fill="#64748b">[0.18s]</text>
        <text x="64" y="56" fill="#818cf8" font-weight="bold">[GRAPH]</text>
        <text x="145" y="56" fill="#cbd5e1">Built Edge-GNN placement graph: 18 hard macros · 1,240 stdcells</text>
      </g>

      <!-- Line 4: MDP Canvas Init -->
      <g class="line-4 anim-loop">
        <text y="84" fill="#64748b">[0.42s]</text>
        <text x="64" y="84" fill="#a855f7" font-weight="bold">[MDP]</text>
        <text x="145" y="84" fill="#cbd5e1">128x128 placement canvas initialized with dynamic legal cell mask</text>
      </g>

      <!-- Line 5: RL Placement -->
      <g class="line-5 anim-loop">
        <text y="112" fill="#64748b">[0.95s]</text>
        <text x="64" y="112" fill="#00f3ff" font-weight="bold">[RL POLICY]</text>
        <text x="175" y="112" fill="#38bdf8">Edge-GNN rollout: 18/18 macros placed · pin alignment optimized</text>
      </g>

      <!-- Line 6: Force-Directed Physics -->
      <g class="line-6 anim-loop">
        <text y="140" fill="#64748b">[1.35s]</text>
        <text x="64" y="140" fill="#14b8a6" font-weight="bold">[PHYSICS]</text>
        <text x="155" y="140" fill="#cbd5e1">Force-directed stdcell relaxation converged in 1.14s (wirelength: 1.129)</text>
      </g>

      <!-- Line 7: SAM Hotspot Detection -->
      <g class="line-7 anim-loop">
        <text y="168" fill="#64748b">[2.10s]</text>
        <text x="64" y="168" fill="#f59e0b" font-weight="bold">[NEURO AI]</text>
        <text x="160" y="168" fill="#fde68a">⚡ SAM Hotspot Vision detected routing congestion center at (64, 48)</text>
      </g>

      <!-- Line 8: Auto-Optimize Re-Placement -->
      <g class="line-8 anim-loop">
        <text y="196" fill="#64748b">[2.85s]</text>
        <text x="64" y="196" fill="#f59e0b" font-weight="bold">[NEURO AI]</text>
        <text x="160" y="196" fill="#cbd5e1">Auto-applied perimeter keep-out constraint ➔ Re-placed RF RAM macros</text>
      </g>

      <!-- Line 9: PPA Improvement Summary -->
      <g class="line-9 anim-loop">
        <text y="224" fill="#64748b">[3.40s]</text>
        <text x="64" y="224" fill="#10b981" font-weight="bold">[PPA GAIN]</text>
        <text x="160" y="224" fill="#4ade80" font-weight="bold">Wirelength: -14.2%  ·  RUDY Congestion: -56.3%  ·  Fmax: 78.4 MHz</text>
      </g>

      <!-- Line 10: DEF Export & OpenROAD Ready -->
      <g class="line-10 anim-loop">
        <text y="252" fill="#64748b">[3.55s]</text>
        <text x="64" y="252" fill="#10b981" font-weight="bold">[EXPORT]</text>
        <text x="155" y="252" fill="#f1f5f9">Standard DEF written to 'runs/servant_soc/placed.def'</text>
        <text x="610" y="252" fill="#38bdf8">[READY FOR OPENROAD]</text>
      </g>

      <!-- Prompt Cursor (Always Active) -->
      <g transform="translate(0, 280)">
        <text y="0" fill="#38bdf8" font-weight="bold">➜</text>
        <text x="20" y="0" fill="#a855f7" font-weight="bold">neuro-silicon</text>
        <rect x="135" y="-13" width="9" height="17" fill="#38bdf8" class="cursor" />
      </g>
    </g>
  </g>
</svg>
